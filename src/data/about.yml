hero:
  title: About
  description: >
    Professor in the School of Government and Public Policy at the University of Arizona,
    where I direct The Arizona Voter Project. My research sits at the intersection of
    political psychology and political behavior, with a focus on American political
    campaigns, ideology, and authoritarianism — and, increasingly, the data science of
    large voter files.

